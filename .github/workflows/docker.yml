name: Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (e.g. 0.2.0)"
        required: true
        type: string
      git_ref:
        description: "Git ref to build from"
        required: true
        default: "main"
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.version || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.image_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: manifold
            image_name: manifold
          - release: manifold_edge
            image_name: manifold-edge

    steps:
      - name: Resolve version and ref
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            REF="$TAG"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            REF="${{ inputs.git_ref }}"
          fi

          if [ -z "$VERSION" ]; then
            echo "Version is required" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/gsmlg-dev/${{ matrix.image_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=v${{ steps.meta.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            RELEASE=${{ matrix.release }}
          cache-from: type=gha,scope=${{ matrix.release }}
          cache-to: type=gha,mode=max,scope=${{ matrix.release }}

  update-release-notes:
    name: Update release notes
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version
        id: meta
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Append Docker image section to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          BODY="$(gh release view "$TAG" --json body -q '(.body // "")')"
          MARKER="<!-- docker-images -->"

          DOCKER_SECTION="$(cat <<EOF
          ${MARKER}
          ## Docker images

          - \`ghcr.io/gsmlg-dev/manifold:${VERSION}\`
          - \`ghcr.io/gsmlg-dev/manifold:v${VERSION}\`
          - \`ghcr.io/gsmlg-dev/manifold:latest\`
          - \`ghcr.io/gsmlg-dev/manifold-edge:${VERSION}\`
          - \`ghcr.io/gsmlg-dev/manifold-edge:v${VERSION}\`
          - \`ghcr.io/gsmlg-dev/manifold-edge:latest\`
          EOF
          )"
          DOCKER_SECTION="$(printf '%s\n' "$DOCKER_SECTION" | sed 's/^          //')"

          if printf '%s\n' "$BODY" | grep -Fq "$MARKER"; then
            BODY="$(printf '%s\n' "$BODY" | awk -v marker="$MARKER" '$0 == marker { exit } { print }')"
          fi

          BODY="$(printf '%s\n' "$BODY" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')"

          {
            if [ -n "$BODY" ]; then
              printf '%s\n\n' "$BODY"
            fi
            printf '%s\n' "$DOCKER_SECTION"
          } > /tmp/release-notes.md

          gh release edit "$TAG" --notes-file /tmp/release-notes.md
