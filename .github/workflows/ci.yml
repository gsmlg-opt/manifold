name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTLER_PRECOMPILED_GLOBAL_CACHE_PATH: ${{ github.workspace }}/.nif-cache/rustler
  ZIGLER_PRECOMPILED_GLOBAL_CACHE_PATH: ${{ github.workspace }}/.nif-cache/zigler
  ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/.nif-cache/elixir_make
  MIX_ENV: test

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18.4"

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            ~/.hex
            ~/.mix
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Prefetch verified native archives
        run: elixir scripts/prefetch_nifs.exs

      - name: Check formatting
        run: mix format --check-formatted

  compile:
    name: Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18.4"

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            ~/.hex
            ~/.mix
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Prefetch verified native archives
        run: elixir scripts/prefetch_nifs.exs

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  js-check:
    name: JS Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18.4"

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            ~/.hex
            ~/.mix
          key: ${{ runner.os }}-mix-js-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-js-
            ${{ runner.os }}-mix-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Prefetch verified native archives
        run: elixir scripts/prefetch_nifs.exs

      - name: Check JavaScript
        run: mix duskmoon_bundler.js.check
