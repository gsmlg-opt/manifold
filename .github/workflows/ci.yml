name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: manifold_dev
          POSTGRES_PASSWORD: manifold_dev
          POSTGRES_DB: manifold_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://manifold_dev:manifold_dev@localhost:5432/manifold_dev
      TEST_DATABASE_URL: postgres://manifold_dev:manifold_dev@localhost:5432/manifold_test
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.18.4"

      - name: Create test database
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE manifold_test;' || true

      - name: Fetch dependencies
        run: mix deps.get

      - name: Migrate
        run: mix ecto.migrate

      - name: Format
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Test
        run: mix test
